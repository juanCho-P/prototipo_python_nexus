{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Error del servidor</title>
    <link rel="shortcut icon" href="{% static 'img/logo.png' %}" type="image/png">
    
    <!-- Mismo CSS con la clase .error-500 -->
    <link rel="stylesheet" href="{% static 'css/error/error.css' %}">
</head>
<body>
    <div class="error-container">
        <div class="error-card error-500">
            <div class="error-code">500</div>
            <h1 class="error-title">Error del servidor</h1>
            <p class="error-description">
                Ocurrió un problema interno inesperado. Nuestro equipo técnico ha sido notificado para resolverlo pronto.
            </p>
            <div class="error-actions">
                <a href="/" class="error-btn">Volver al Inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
