{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'auth.css' %}">
    <title>Contraseña Restablecida - Nexus</title>
    <style>
        .container {
            min-height: 350px !important;
            height: auto !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }
        .form-container.sign-in {
            position: relative !important;
            left: 0 !important;
            width: 100% !important;
            opacity: 1 !important;
            z-index: 5 !important;
            transform: none !important;
            padding: 40px !important;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container active" id="container">
        <div class="form-container sign-in">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <i class="fa-solid fa-circle-check" style="font-size: 50px; color: #2ecc71; margin-bottom: 15px;"></i>
                <h1>¡Contraseña Cambiada!</h1>
                <p style="font-size: 14px; color: #666; margin: 15px 0;">
                    Tu contraseña ha sido actualizada correctamente en la base de datos.
                </p>
                
                <a href="{% url 'login' %}" onclick="window.location.replace('{% url ¨login¨ % }'); return false;" class="btn-login">
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>

</body>
</html>
